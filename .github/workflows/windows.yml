name: Verify raw PE toolkit
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Standard-library construction and context checks
        run: python tests/test_primitives.py
      - name: Native maintenance regression fixture
        run: python tests/run_checks.py
      - name: Install optional development-only analyzer
        run: "python -m pip install --only-binary=:all: --no-deps capstone==5.0.7"
      - name: Static instruction-analysis regressions
        run: python tests/test_primitives.py StaticAuditTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-check-evidence
          path: out/evidence/*.json
